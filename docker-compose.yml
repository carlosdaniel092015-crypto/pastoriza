# Compose para Dokploy (o `docker compose` a secas). Bot + Redis en un solo deploy.
#
# En Dokploy: Create Service -> Compose, Provider Git, este archivo, y las variables
# en la pestaña Environment. Traefik ya viene con Dokploy: sólo asignás el dominio
# desde la UI y él pone las labels.
#
# Ver DESPLIEGUE_VPS.md para el orden de la mudanza. Dos variables OBLIGATORIAS acá:
#   REDIS_PASSWORD   -> la clave del Redis (el deploy falla si falta, a propósito)
#   REDIS_URL        -> redis://:LA_MISMA_CLAVE@redis:6379/1

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pastoriza-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Sólo expuesto en localhost: el tráfico entra por Traefik o por el
      # Cloudflare Tunnel. Nunca abras esto a 0.0.0.0 en el VPS.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - dokploy-network

  # Redis NO es sólo cache en este proyecto: acá viven la config de negocio (precios,
  # mínimos, mensajes, los dos canales), los prompts editados desde el panel, las
  # reglas aprendidas y el índice de conversaciones del CRM. De ahí las tres
  # decisiones de abajo; ninguna es cosmética.
  redis:
    image: redis:7-alpine
    container_name: pastoriza-redis
    restart: unless-stopped
    # --appendonly: sobrevive a un reinicio del VPS. Sin esto, un reboot borra la
    #   config del negocio y el bot arranca con los defaults del código.
    # --maxmemory-policy noeviction: si algún día se pone un tope de memoria, que
    #   Redis RECHACE escrituras en vez de borrar keys al azar. La política por
    #   defecto (con maxmemory puesto) borraría precios en silencio.
    # --requirepass: sin clave, cualquier cosa en la red de Docker lo lee y lo
    #   escribe. Ahí están los teléfonos y las conversaciones de los clientes.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?falta REDIS_PASSWORD en Environment}
    environment:
      # Sólo para que el healthcheck de abajo pueda autenticarse.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en Environment}
    # A propósito SIN `ports`: se alcanza por nombre de servicio (`redis:6379`) desde
    # la red de Docker. Publicarlo al VPS sería exponerlo a internet.
    volumes:
      - redis-data:/data
    healthcheck:
      # `depends_on: service_healthy` usa esto: el bot no arranca antes que Redis.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

volumes:
  redis-data:

networks:
  dokploy-network:
    external: true
